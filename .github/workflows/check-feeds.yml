name: فحص المصادر

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-feeds.mjs
      - run: |
          git config user.name "mogaz-bot"
          git config user.email "mogaz-bot@users.noreply.github.com"
          git add tools/feed-check.json
          git commit -m "نتيجة فحص المصادر" || exit 0
          git pull --rebase -X ours origin main || true
          git push
