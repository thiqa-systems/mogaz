name: تحديث الأخبار

on:
  schedule:
    - cron: "*/10 * * * *"   # كل 10 دقائق (GitHub قد يؤخر المواعيد المجدولة وقت الزحام)
  workflow_dispatch:        # زر تشغيل يدوي من تبويب Actions

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: جمع الأخبار
        run: node scripts/update.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      - name: حفظ البيانات
        run: |
          git config user.name "mogaz-bot"
          git config user.email "mogaz-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "تحديث الأخبار"
          git pull --rebase -X ours origin main || true
          git push
