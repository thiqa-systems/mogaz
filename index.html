<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موجز الصباح</title>
<meta name="description" content="أهم أخبار مصر والعالم والاقتصاد والتكنولوجيا من مصادر متعددة، تتحدّث كل 10 دقائق.">
<meta name="theme-color" content="#0B6B6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
/* عمود واحد للقراءة على الموبايل: شريط أقسام ثابت، وكل خبر سطر عنوان + مصدره ووقته. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#13222B; --muted:#586972; --line:#DCE3E2;
  --accent:#0B6B6B; --accent-soft:#E0EFEE; --note:#8A5A0A; --note-soft:#FBF1DC;
  --up:#1F6F4A; --down:#A33A2A;
  --display:"Reem Kufi","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark;
    --bg:#0E171B; --surface:#172329; --ink:#E7EEF0; --muted:#94A5AD; --line:#27363D;
    --accent:#56C4BE; --accent-soft:#16343A; --note:#E8B45C; --note-soft:#2E2718;
    --up:#6FCB9B; --down:#F08B78; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px 48px;display:flex;flex-direction:column;gap:18px}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.3;margin:0;color:var(--accent)}
.updated{color:var(--muted);font-size:13px}
.btn{font:inherit;font-size:14px;font-weight:600;cursor:pointer;border:0;border-radius:999px;
  background:var(--accent);color:var(--surface);padding:8px 16px}
.btn[hidden]{display:none}
.chip{font:inherit;font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tabs{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;z-index:2;background:var(--bg);
  padding:10px 0;border-bottom:1px solid var(--line)}
.minute{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--accent);
  border-radius:10px;padding:14px 18px}
.minute[hidden]{display:none}
.minute h2{font-family:var(--display);font-size:18px;margin:0 0 6px}
.minute ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
main{display:flex;flex-direction:column;gap:22px}
section>h2{font-family:var(--display);font-size:21px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
section>h2 span{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted)}
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
ul.list li{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
ul.list li:last-child{border-bottom:0}
.t{font-size:16.5px;font-weight:600;line-height:1.55;text-decoration:none;text-wrap:pretty}
.t:hover{text-decoration:underline}
.m{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.m .new{font-style:normal;background:var(--accent);color:var(--surface);font-weight:600;font-size:12px;padding:1px 9px;border-radius:999px}
.m b{color:var(--accent);background:var(--accent-soft);font-weight:500;padding:1px 9px;border-radius:999px}
.impact{background:var(--note-soft);border-radius:8px;padding:8px 12px;font-size:14.5px}
.impact b{color:var(--note);font-size:12.5px;display:block}
.mk{display:flex;flex-direction:column;gap:6px}
.mk[hidden],.ind[hidden]{display:none}
.tiles{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
.tile{flex:0 0 auto;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;scroll-snap-align:start;display:flex;flex-direction:column;gap:1px}
.tile .n{font-size:12.5px;color:var(--muted)}
.tile .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .u{font-size:12px;color:var(--muted);font-weight:400;margin-inline-start:4px}
.tile .c{font-size:13px;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.tile .c.up{color:var(--up)} .tile .c.down{color:var(--down)}
.tile.stale{opacity:.65}
.fine{margin:0;font-size:12px;color:var(--muted)}
.ind h2{font-family:var(--display);font-size:21px;margin:0 0 10px}
.ind .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ind .val{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.state{color:var(--muted);text-align:center;padding:28px 0}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px}
footer p{margin:0 0 6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>موجز الصباح</h1>
      <div class="updated" id="updated">جارٍ التحميل…</div>
    </div>
    <button class="btn" id="install" type="button" hidden>تثبيت التطبيق</button>
  </header>

  <section class="mk" id="mkBox" hidden aria-label="الأسعار">
    <div class="tiles" id="markets"></div>
    <p class="fine" id="mkNote"></p>
  </section>

  <div class="minute" id="minuteBox" hidden>
    <h2>في دقيقة</h2>
    <ol id="minute"></ol>
  </div>

  <nav class="tabs" id="tabs" aria-label="الأقسام"></nav>
  <main id="feed"><p class="state">جارٍ تحميل الأخبار…</p></main>

  <section class="ind" id="indBox" hidden>
    <h2>مؤشرات مصر الأساسية</h2>
    <ul class="list" id="indicators"></ul>
  </section>

  <footer>
    <p>العناوين من مصادرها المذكورة، والضغط على الخبر يفتحه في موقع المصدر. الجمع والترتيب آليان بدون تحرير بشري.</p>
    <p>فقرة «ماذا يعني لك» إن ظهرت يكتبها مساعد آلي من العناوين فقط، وليست نصيحة استثمارية.</p>
  </footer>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var state = { sec: "all", data: null };
  var rtf = ("Intl" in window && Intl.RelativeTimeFormat) ? new Intl.RelativeTimeFormat("ar", { numeric: "auto" }) : null;

  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function ago(iso){
    var t = Date.parse(iso); if (!isFinite(t)) return "";
    var mins = Math.round((t - Date.now()) / 60000);
    if (!rtf) return new Date(t).toLocaleString("ar-EG");
    if (Math.abs(mins) < 60) return rtf.format(mins, "minute");
    var hrs = Math.round(mins / 60);
    if (Math.abs(hrs) < 24) return rtf.format(hrs, "hour");
    return rtf.format(Math.round(hrs / 24), "day");
  }
  function safe(u){ return /^https?:\/\//i.test(u || "") ? u : null; }

  function render(){
    var d = state.data, feed = $("feed");
    if (!d) return;
    $("updated").textContent = "آخر تحديث " + ago(d.updated);

    var nf = function(v){ return Number(v).toLocaleString("ar-EG", { maximumFractionDigits: 4 }); };
    var mk = $("markets"); mk.textContent = "";
    (d.markets || []).forEach(function(x){
      var t = el("div", "tile" + (x.stale ? " stale" : ""));
      t.title = (x.source || "") + (x.asOf ? " · " + new Date(x.asOf).toLocaleString("ar-EG") : "");
      t.appendChild(el("span", "n", x.name));
      var v = el("span", "v", nf(x.value)); v.appendChild(el("span", "u", x.unit || "")); t.appendChild(v);
      if (typeof x.change === "number"){
        var up = x.change > 0, dn = x.change < 0;
        t.appendChild(el("span", "c" + (up ? " up" : dn ? " down" : ""), (up ? "▲ +" : dn ? "▼ " : "") + x.change.toFixed(2) + "%"));
      } else if (x.stale){ t.appendChild(el("span", "c", "آخر قيمة متاحة")); }
      mk.appendChild(t);
    });
    $("mkBox").hidden = !(d.markets || []).length;
    $("mkNote").textContent = "التغير مقارنة بإغلاق اليوم السابق. سعر الذهب المحلي تقديري من السعر العالمي وسعر الدولار الرسمي، وسعر محلات الصاغة يختلف (مصنعية وفرق سوق).";

    var ind = $("indicators"); ind.textContent = "";
    (d.indicators || []).forEach(function(x){
      var li = el("li"), row = el("div", "row");
      row.appendChild(el("span", "t", x.name)); row.appendChild(el("span", "val", x.value));
      li.appendChild(row);
      var meta = el("div", "m"); meta.appendChild(el("span", null, x.note || ""));
      var u = safe(x.url);
      var src = el(u ? "a" : "b", null, x.source || ""); if (u){ src.href = u; src.target = "_blank"; src.rel = "noopener noreferrer"; src.style.color = "var(--accent)"; }
      meta.appendChild(src); li.appendChild(meta); ind.appendChild(li);
    });
    $("indBox").hidden = !(d.indicators || []).length;

    var mb = $("minuteBox"), m = $("minute"); m.textContent = "";
    (d.minute || []).forEach(function(x){ m.appendChild(el("li", null, x)); });
    mb.hidden = !(d.minute || []).length;

    var tabs = $("tabs"); tabs.textContent = "";
    [{ id: "all", title: "الكل" }].concat(d.sections || []).forEach(function(s){
      var b = el("button", "chip", s.title); b.type = "button";
      b.setAttribute("aria-pressed", state.sec === s.id ? "true" : "false");
      b.addEventListener("click", function(){ state.sec = s.id; render(); window.scrollTo(0, 0); });
      tabs.appendChild(b);
    });

    feed.textContent = "";
    var shown = 0;
    (d.sections || []).forEach(function(s){
      if (state.sec !== "all" && state.sec !== s.id) return;
      var items = state.sec === "all" ? (s.items || []).slice(0, 6) : (s.items || []);
      if (!items.length) return;
      shown += items.length;
      var sec = el("section"), h = el("h2", null, s.title);
      h.appendChild(el("span", null, new Set(items.map(function(i){ return i.source; })).size + " مصادر"));
      sec.appendChild(h);
      var ul = el("ul", "list");
      items.forEach(function(it){
        var li = el("li"), u = safe(it.url);
        var a = el(u ? "a" : "span", "t", it.title);
        if (u){ a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; }
        li.appendChild(a);
        var meta = el("div", "m");
        if (it.seen && Date.now() - Date.parse(it.seen) < 60 * 60000) meta.appendChild(el("i", "new", "جديد"));
        meta.appendChild(el("b", null, it.source)); meta.appendChild(el("span", null, ago(it.time)));
        li.appendChild(meta);
        if (it.impact){ var im = el("div", "impact"); im.appendChild(el("b", null, "ماذا يعني لك")); im.appendChild(document.createTextNode(it.impact)); li.appendChild(im); }
        ul.appendChild(li);
      });
      sec.appendChild(ul); feed.appendChild(sec);
    });
    if (!shown) feed.appendChild(el("p", "state", "لا توجد أخبار في هذا القسم الآن."));
  }

  function load(){
    fetch("data.json?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ state.data = d; render(); })
      .catch(function(){
        if (state.data) return;
        $("updated").textContent = "";
        $("feed").textContent = "";
        $("feed").appendChild(el("p", "state", "تعذّر تحميل الأخبار. تأكد من الاتصال بالإنترنت ثم افتح التطبيق مرة أخرى."));
      });
  }
  load();
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) load(); });
  setInterval(function(){ if (!document.hidden) load(); }, 5 * 60 * 1000);

  var deferred = null, btn = $("install");
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred = e; btn.hidden = false; });
  btn.addEventListener("click", function(){ if (!deferred) return; deferred.prompt(); deferred = null; btn.hidden = true; });
  window.addEventListener("appinstalled", function(){ btn.hidden = true; });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
